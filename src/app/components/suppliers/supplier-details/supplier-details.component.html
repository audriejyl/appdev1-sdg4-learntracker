<div class="page-wrapper">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="detail-card" *ngIf="supplier; else notFound">
    <div class="card-header">
      <button class="back-btn" (click)="back()">
        &larr; Back
      </button>
      <div class="header-title">
        <div>
          <h2>Course Details</h2>
          <p>Edit and manage course information</p>
        </div>
      </div>
    </div>
    <form class="detail-form" (ngSubmit)="save()">
      <div class="form-row">
        <div class="form-group">
          <label>Course ID</label>
          <div class="input-wrapper">
            <input
              type="text"
              [(ngModel)]="supplier.id"
              name="id"
              disabled
              class="input-disabled"
            />
          </div>
          <span class="field-hint">Auto-generated, read-only</span>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Course Title</label>
          <div class="input-wrapper">
            <input
              type="text"
              [(ngModel)]="supplier.supplierName"
              name="supplierName"
              placeholder="Enter course title"
            />
          </div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Instructor</label>
          <div class="input-wrapper">
            <input
              type="text"
              [(ngModel)]="supplier.contactPerson"
              name="contactPerson"
              placeholder="Enter instructor name"
            />
          </div>
        </div>
      </div>

      <div class="toast" *ngIf="saveSuccess">
        Changes saved successfully!
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="back()">
          Cancel
        </button>
        <button type="submit" class="btn-primary" (click)="save()" style="color: #ffffff; background-color: #2563eb; padding: 10px 24px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer;">
          Save
        </button>
      </div>

    </form>
  </div>
  <ng-template #notFound>
    <div class="not-found-card">
      <h3>Course Not Found</h3>
      <p>We couldn't find a course with that ID.</p>
      <button class="btn-primary" (click)="back()">&larr; Go Back</button>
    </div>
  </ng-template>
</div>
