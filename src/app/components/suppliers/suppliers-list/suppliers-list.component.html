<div class="container">
  <div class="header">
    <h2>Suppliers List</h2>

    <input
      type="text"
      class="search-box"
      placeholder="Search suppliers..."
      [(ngModel)]="searchTerm"
    />
  </div>

  <table class="table" *ngIf="filteredSuppliers.length > 0; else empty">
    <thead>
      <tr>
        <th>Supplier Name</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let supplier of filteredSuppliers">
        <td>{{ supplier.supplierName }}</td>
        <td>
          <button class="view-btn" (click)="viewSupplierDetails(supplier.id)">
            View
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #empty>
    <div class="empty">No suppliers found</div>
  </ng-template>
</div>
