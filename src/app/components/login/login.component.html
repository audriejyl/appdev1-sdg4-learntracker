<div class="page-wrapper">

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="brand">

    <span class="brand-icon"></span>

    <div>
      <h1 class="brand-name">LearnTracker</h1>
      <span class="brand-tag">SDG 4 · Quality Education</span>
    </div>

  </div>

  <div class="card">

    <!-- HEADER -->
    <div class="card-header">

      <h2 *ngIf="!showRegister">Welcome Back</h2>
      <h2 *ngIf="showRegister">Create Account</h2>

      <p *ngIf="!showRegister">Sign in to your account</p>
      <p *ngIf="showRegister">Register a new account</p>

    </div>

    <!-- LOGIN FORM -->
    <form *ngIf="!showRegister" class="auth-form" (ngSubmit)="login()">

      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrap">
          <span class="icon">✉</span>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="you@example.com"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <span class="icon">🔒</span>
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter your password"
            required
          />
        </div>
      </div>

      <div *ngIf="errorMsg" class="alert alert-error">
        ⚠ {{ errorMsg }}
      </div>

      <button type="submit" class="btn-primary">
        Sign In
      </button>

    </form>

    <!-- REGISTER FORM -->
    <form *ngIf="showRegister" class="auth-form" (ngSubmit)="register()">

      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrap">
          <span class="icon">✉</span>
          <input
            type="email"
            [(ngModel)]="registerEmail"
            name="registerEmail"
            placeholder="you@example.com"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <span class="icon">🔒</span>
          <input
            type="password"
            [(ngModel)]="registerPassword"
            name="registerPassword"
            placeholder="Minimum 6 characters"
            required
          />
        </div>
      </div>

      <div *ngIf="errorMsg" class="alert alert-error">
        ⚠ {{ errorMsg }}
      </div>

      <button type="submit" class="btn-primary">
        Register
      </button>

    </form>

    <!-- FOOTER SWITCH -->
    <div class="card-footer">

      <span *ngIf="!showRegister">
        Don't have an account?
        <a href="javascript:void(0)" (click)="showRegister = true">
          Register here
        </a>
      </span>

      <span *ngIf="showRegister">
        Already have an account?
        <a href="javascript:void(0)" (click)="showRegister = false">
          Sign in
        </a>
      </span>

    </div>

  </div>

</div>
