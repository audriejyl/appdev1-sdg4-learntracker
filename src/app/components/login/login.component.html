<div class="page-wrapper">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="brand">
    <span class="brand-icon"></span>
    <div>
      <h1 class="brand-name">LearnTracker</h1>
      <span class="brand-tag">SDG 4 · Quality Education</span>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Welcome Back</h2>
      <p>Sign in to your account</p>
    </div>

    <form class="auth-form" (ngSubmit)="login()">

      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <span class="icon">✉</span>
          <input id="email" type="email" [(ngModel)]="email"
            name="email" placeholder="you@example.com" required />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <span class="icon">🔒</span>
          <input
            id="password"
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter your password"
            required
          />
        </div>
      </div>

      <div class="form-options">
        <label class="remember">
          <input type="checkbox" name="remember" /> Remember me
        </label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <div *ngIf="errorMsg" class="alert alert-error">⚠ {{ errorMsg }}</div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        <span *ngIf="!isLoading">Sign In</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>

    </form>

    <div class="card-footer">
      Don't have an account? <a routerLink="/home">Register here</a>
    </div>
  </div>
